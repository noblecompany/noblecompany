name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 런은 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # 저장소 이름이 곧 하위 경로가 된다 (/noble-preview/)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA 폴백 생성
        # Pages는 정적 서버라 /work/edyuwil 같은 주소를 직접 열면 404가 난다.
        # 404.html 을 index.html 과 같게 두면 라우터가 경로를 처리한다.
        run: cp dist/index.html dist/404.html

      - name: Jekyll 처리 비활성화
        # .nojekyll 이 없으면 Pages가 산출물을 Jekyll로 한 번 더 훑으면서
        # _ 로 시작하는 경로 등을 걸러낸다. 정적 빌드 결과는 그대로 올려야 한다.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
